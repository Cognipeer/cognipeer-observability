name: Release

# GitHub Releases publish npm; push tags retain the PyPI publishing path:
#   js-v0.2.0      → npm from a published GitHub Release
#   py-v0.2.0      → PyPI from the tag push
#   v0.2.0         → npm from the Release and PyPI from the tag push
on:
  push:
    tags: ['v*', 'js-v*', 'py-v*']

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing js-vX.Y.Z or vX.Y.Z tag to publish"
        required: true
        type: string

jobs:
  npm:
    if: >-
      (github.event_name == 'release' &&
      (startsWith(github.event.release.tag_name, 'js-v') || startsWith(github.event.release.tag_name, 'v'))) ||
      (github.event_name == 'workflow_dispatch' &&
      (startsWith(inputs.tag, 'js-v') || startsWith(inputs.tag, 'v')))
    runs-on: cognipeer-azure-runners
    defaults:
      run:
        working-directory: js
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TAG_VERSION="${TAG_NAME#js-}"
          TAG_VERSION="${TAG_VERSION#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Publish
        run: npm publish --access public

  pypi:
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref_name, 'py-v') || startsWith(github.ref_name, 'v'))
    runs-on: cognipeer-azure-runners
    defaults:
      run:
        working-directory: python
    environment: pypi
    permissions:
      contents: read
      # Trusted publishing — no long-lived PyPI token in repository secrets.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install build
      - name: version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#py-}"
          PKG="v$(python -c "import re,pathlib;print(re.search(r'^version = \"(.+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")"
          [ "$TAG" = "$PKG" ] || { echo "tag $TAG != package $PKG"; exit 1; }
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
